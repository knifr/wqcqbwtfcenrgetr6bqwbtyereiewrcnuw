<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Рассылка рекламы</title>
<style>
:root{--bg:#fff;--card:#f2f1f7;--text:#1a1822;--hint:#6e6a7c;--accent:#6d3cf0;--on:#fff;--bad:#c62828;--good:#1b7f3b}
@media (prefers-color-scheme:dark){:root{--bg:#121018;--card:#1d1a27;--text:#f1eff7;--hint:#9d98b0;--accent:#8c63ff;--bad:#ff8a80;--good:#7be495}}
*{box-sizing:border-box}
body{margin:0;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text)}
main{max-width:560px;margin:0 auto;padding:28px 18px 48px;display:grid;gap:14px}
h1{font-size:28px;line-height:1.1;margin:0;letter-spacing:-.02em}
p{margin:0}.hint{color:var(--hint);font-size:14px}
.card{background:var(--card);border-radius:14px;padding:16px;display:grid;gap:12px}
label{display:grid;gap:4px;font-size:14px;color:var(--hint)}
input[type=text],input[type=password],textarea{font:inherit;width:100%;padding:11px 12px;border-radius:10px;border:1px solid transparent;background:var(--bg);color:var(--text)}
textarea{min-height:110px;resize:vertical}
input[type=file]{font:inherit;font-size:14px;max-width:100%}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{appearance:none;border:0;font:inherit;font-weight:600;padding:13px 16px;border-radius:12px;cursor:pointer;background:var(--bg);color:var(--text)}
.btn.main{background:var(--accent);color:var(--on)}
.btn:disabled{opacity:.55}
.btn:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.status{font-size:14px;min-height:1.2em}.err{color:var(--bad)}.ok{color:var(--good)}
[hidden]{display:none}
</style>
</head>
<body>
<main>
  <h1>Рассылка рекламы</h1>

  <section class="card" id="login">
    <label>Пароль (переменная BROADCAST_SECRET)
      <input type="password" id="pwd" autocomplete="current-password">
    </label>
    <button class="btn main" id="enter">Войти</button>
    <p class="status" id="lst"></p>
  </section>

  <section class="card" id="panel" hidden>
    <p class="hint" id="count"></p>
    <label>Текст. Можно &lt;b&gt;жирный&lt;/b&gt;, &lt;i&gt;курсив&lt;/i&gt;, &lt;a href="https://..."&gt;ссылка&lt;/a&gt;
      <textarea id="text"></textarea>
    </label>
    <label>Фото, видео, аудио или файл (необязательно)
      <input type="file" id="media">
    </label>
    <label>Кнопки: «Текст - https://ссылка», одна строка это один ряд, несколько кнопок в ряду через |
      <textarea id="buttons" placeholder="Канал - https://t.me/speedupaudioe"></textarea>
    </label>
    <label>Тест: твой Telegram ID (узнать: команда /id в боте)
      <input type="text" id="testto" inputmode="numeric">
    </label>
    <div class="row">
      <button class="btn" id="test">Отправить тест</button>
      <button class="btn main" id="send">Отправить всем</button>
    </div>
    <p class="status" id="st"></p>
  </section>
</main>
<script>
const $ = (s) => document.querySelector(s);
let pwd = "";
async function call(path, init) {
  init = init || {};
  init.headers = { "X-Admin-Password": pwd };
  let r;
  try { r = await fetch(path, init); } catch (e) { return { error: "Нет связи с сервером" }; }
  try { return await r.json(); }
  catch (e) { return { error: "Ошибка " + r.status + (r.status === 404 ? ": на сервере старая версия бота без этой страницы" : "") }; }
}
function say(text, kind, id) { const e = $(id || "#st"); e.textContent = text; e.className = "status " + (kind || ""); }
function body(extra) {
  const fd = new FormData();
  fd.append("text", $("#text").value.trim());
  fd.append("buttons", $("#buttons").value.trim());
  const f = $("#media").files[0];
  if (f) fd.append("media", f);
  for (const k in extra) fd.append(k, extra[k]);
  return { method: "POST", body: fd };
}
function describe(j) {
  if (j.status === "done") return "Готово. Доставлено: " + j.sent + ", заблокировали бота: " + j.blocked + ", ошибок: " + j.failed;
  if (j.status === "error") return "Рассылка остановилась из-за ошибки. Смотри логи на Render.";
  return "Отправлено " + j.sent + " из " + j.total + "…";
}
async function poll() {
  for (;;) {
    const j = await call("/admin/api/job");
    if (j.error) return say(j.error, "err");
    if (j.status === "idle") return;
    say(describe(j), j.status === "done" ? "ok" : j.status === "error" ? "err" : "");
    if (j.status !== "running" && j.status !== "starting") return;
    await new Promise((r) => setTimeout(r, 2000));
  }
}
$("#enter").addEventListener("click", async () => {
  pwd = $("#pwd").value.trim();
  const r = await call("/admin/api/stats", { method: "POST" });
  if (r.error) return say(r.error, "err", "#lst");
  $("#login").hidden = true; $("#panel").hidden = false;
  $("#count").textContent = r.warning || ("Получателей: " + r.recipients + " (все, кто запускал бота)");
  poll();
});
$("#pwd").addEventListener("keydown", (e) => { if (e.key === "Enter") $("#enter").click(); });
$("#test").addEventListener("click", async () => {
  const id = $("#testto").value.trim();
  if (!/^\d+$/.test(id)) return say("Введи свой Telegram ID цифрами", "err");
  say("Отправляю тест…");
  const r = await call("/admin/api/send", body({ test_to: id }));
  r.error ? say(r.error, "err") : say("Тест отправлен, проверь чат с ботом.", "ok");
});
$("#send").addEventListener("click", async () => {
  if (!confirm("Отправить рассылку всем получателям?")) return;
  say("Запускаю…");
  const r = await call("/admin/api/send", body({}));
  if (r.error) return say(r.error, "err");
  poll();
});
</script>
</body>
</html>
