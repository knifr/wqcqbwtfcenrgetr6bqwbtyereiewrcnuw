# Render Blueprint. Значения переменных вводятся в панели Render, в репозиторий их не кладём.
services:
  - type: web
    name: music-finder-bot
    runtime: docker
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: BROADCAST_SECRET
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
